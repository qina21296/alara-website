# Netlify CMS Configuration
backend:
  name: git-gateway
  branch: main
  base_url: https://heroic-moonbeam-cffb4d.netlify.app  # OAuth callback URL

media_folder: "images"
public_folder: "/images"

collections:
  # Project Cases - 项目案例
  - name: "projects"
    label: "Project Cases"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Project Name", name: "title", widget: "string"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Category", name: "category", widget: "select", options: ["Roofing", "Cladding", "Wall", "Ceiling"]}

  # Testimonials - 客户评价
  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Client Name", name: "name", widget: "string"}
      - {label: "Company", name: "company", widget: "string"}
      - {label: "Review", name: "review", widget: "text"}
      - {label: "Rating", name: "rating", widget: "number", min: 1, max: 5}

  # Products - 产品
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Features", name: "features", widget: "list"}
      - {label: "Image", name: "image", widget: "image"}
